# Advanced CodeQL setup.
#
# Default setup cannot build this repo's Swift (CMake + AppKit, no Xcode
# project / Package.swift at the root). Swift uses build-mode: manual so
# CodeQL can trace a real compile.
#
# Timing note: a native local macOS GUI build is a few minutes; the same
# tree under CodeQL's DYLD tracer + mandatory x86_64 cross-compile is
# ~20–25 minutes on GitHub-hosted runners. We cannot remove that tracer
# overhead. Instead we (1) keep C/Python cheap, (2) run only on
# pull_request + weekly schedule (no push), (3) skip Swift on PRs that do
# not touch macOS/Swift sources, (4) ccache the C objects across runs, (5)
# cross-compile x86_64 so C/Swift match the tracer (native arm64 was
# retried on macos-26 and still fails at link time), (6) still build every
# Swift-bearing target so CodeQL does not mark those sources as unscanned.
#
# Docs:
#   https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
#   https://docs.github.com/en/code-security/reference/code-scanning/troubleshoot-analysis-errors/analysis-takes-too-long

name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly full coverage (including Swift) on the default branch.
    - cron: '17 6 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast path filter so PRs that only touch C/docs/etc. skip the Swift job.
  # Schedule always analyzes Swift (changes job is skipped on non-PR).
  changes:
    name: Detect macOS / Swift paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            macos:
              - 'macos/**'
              - 'cmake/macos_early.cmake'
              - 'cmake/platforms/macos.cmake'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'

  analyze-light:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

  analyze-swift:
    name: Analyze (swift)
    needs: changes
    # Always on schedule; on PRs only when macOS/Swift (or this workflow) changed.
    # needs.changes.result is 'skipped' when changes job's if: is false (non-PR).
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.macos == 'true') &&
      (needs.changes.result == 'success' || needs.changes.result == 'skipped')
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-codeql-swift-x86_64-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'crypto/**', 'ssh/**', 'macos/**/*.c', 'macos/**/*.m') }}
          restore-keys: |
            ccache-codeql-swift-x86_64-

      # Configure *before* CodeQL init so try_compile probes are not traced
      # (otherwise configure alone is ~13 minutes).
      - name: Configure macOS GUI (untraced)
        run: |
          set -euo pipefail
          brew install ninja ccache
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache -z
          echo "host arch: $(uname -m)"
          # CodeQL's Swift tracer wraps the build as an x86_64 process (Rosetta
          # on macos-*-arm64 runners), so swiftc/ld require x86_64. Cross-
          # compile the tree for x86_64 so C and Swift agree (and NEON feature
          # tests stay off). Native arm64 was retried on macos-26 and still
          # fails at link with "found architecture arm64, required x86_64".
          cmake -S . -B build-codeql -G Ninja \
            -DPUTTY_MACOS_GUI=ON \
            -DPUTTY_MACOS_UNIVERSAL=OFF \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
          grep -E '^CMAKE_OSX_ARCHITECTURES:STRING=x86_64$' \
            build-codeql/CMakeCache.txt
          if grep -E '^HAVE_NEON_CRYPTO:(INTERNAL|BOOL)=1$' \
               build-codeql/CMakeCache.txt; then
            echo "error: NEON enabled under x86_64 CodeQL configure" >&2
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: swift
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build macOS GUI (Swift)
        run: |
          set -euo pipefail
          # CodeQL Swift only indexes files compiled under the tracer. Build
          # every Swift-bearing target so puttygen/pterm/smokes/tests are not
          # reported as "excluded from scanning". PuttyMacUI is pulled in via
          # PuTTY/pterm; tracer overhead still dominates wall time.
          targets=(
            PuTTY
            pterm
            puttygen-app
            PuttyBridgeSwiftSmoke
            PuttyBridgeTermPerfTest
          )
          # PuttyMacUITests is optional (needs XCTest + SDK at configure time).
          if ninja -C build-codeql -t targets all 2>/dev/null \
               | grep -E '^PuttyMacUITests:' >/dev/null; then
            targets+=(PuttyMacUITests)
          else
            echo "note: PuttyMacUITests target absent; XCTest suite not traced"
          fi
          cmake --build build-codeql --parallel --target "${targets[@]}"
          ccache -s

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:swift"
