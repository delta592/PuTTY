# Advanced CodeQL setup.
#
# Default setup cannot build this repo's Swift (CMake + AppKit, no Xcode
# project / Package.swift at the root). Swift uses build-mode: manual so
# CodeQL can trace a real compile.
#
# Timing note: a native local macOS GUI build is a few minutes; the same
# tree under CodeQL's DYLD tracer + mandatory x86_64 cross-compile is
# ~20–25 minutes on GitHub-hosted runners. We cannot remove that tracer
# overhead. Instead we (1) keep C/Python cheap, (2) run C/Python on
# pull_request + push to main (Security tab default-branch alerts) +
# weekly schedule + workflow_dispatch, (3) run Swift on schedule,
# workflow_dispatch, and on PR/push that touch macOS/Swift sources (so the
# default-branch language:swift Security config stays fresh — schedule alone
# has proven unreliable here), (4) ccache the C objects across runs,
# (5) cross-compile x86_64 so C/Swift match the tracer (native arm64 was
# retried on macos-26 and still fails at link time), (6) still build every
# Swift-bearing target so CodeQL does not mark those sources as unscanned,
# (7) isolate Swift concurrency from light jobs so a C/Python push cannot
# cancel a long Swift scan on the same ref.
#
# Runner pins: prefer an explicit ubuntu-XX.XX (not ubuntu-latest) so light
# jobs do not silently flip on image renames.
#
# Docs:
#   https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
#   https://docs.github.com/en/code-security/reference/code-scanning/troubleshoot-analysis-errors/analysis-takes-too-long

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full coverage (including Swift) on the default branch.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      run_swift:
        description: 'Run the macOS Swift CodeQL job (updates language:swift on default branch when run from main)'
        type: boolean
        default: true

jobs:
  # Fast path filter so push/PR that only touch C/docs/etc. skip the Swift job.
  # Schedule / workflow_dispatch skip this job; Swift gating treats that as run.
  changes:
    name: Detect macOS / Swift paths
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    concurrency:
      group: codeql-changes-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            macos:
              - 'macos/**'
              - 'cmake/macos_early.cmake'
              - 'cmake/platforms/macos.cmake'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'

  analyze-light:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    concurrency:
      group: codeql-light-${{ github.workflow }}-${{ github.ref }}-${{ matrix.language }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  analyze-swift:
    name: Analyze (swift)
    needs: changes
    # Schedule / dispatch(run_swift): always.
    # PR / push: only when macOS/Swift (or this workflow) changed.
    # needs.changes.result is 'skipped' when changes job's if: is false.
    if: |
      always() &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_swift) ||
        ((github.event_name == 'pull_request' || github.event_name == 'push') && needs.changes.outputs.macos == 'true')
      ) &&
      (needs.changes.result == 'success' || needs.changes.result == 'skipped')
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
      actions: read
    # Separate from light jobs: a cheap C/Python push must not cancel Swift.
    concurrency:
      group: codeql-swift-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache ccache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.ccache
          key: ccache-codeql-swift-x86_64-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'crypto/**', 'ssh/**', 'macos/**/*.c', 'macos/**/*.m') }}
          restore-keys: |
            ccache-codeql-swift-x86_64-

      # Configure *before* CodeQL init so try_compile probes are not traced
      # (otherwise configure alone is ~13 minutes).
      - name: Configure macOS GUI (untraced)
        run: |
          set -euo pipefail
          brew install ninja ccache
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache -z
          echo "host arch: $(uname -m)"
          # CodeQL's Swift tracer wraps the build as an x86_64 process (Rosetta
          # on macos-*-arm64 runners), so swiftc/ld require x86_64. Cross-
          # compile the tree for x86_64 so C and Swift agree (and NEON feature
          # tests stay off). Native arm64 was retried on macos-26 and still
          # fails at link with "found architecture arm64, required x86_64".
          cmake -S . -B build-codeql -G Ninja \
            -DPUTTY_MACOS_GUI=ON \
            -DPUTTY_MACOS_UNIVERSAL=OFF \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
          grep -E '^CMAKE_OSX_ARCHITECTURES:STRING=x86_64$' \
            build-codeql/CMakeCache.txt
          if grep -E '^HAVE_NEON_CRYPTO:(INTERNAL|BOOL)=1$' \
               build-codeql/CMakeCache.txt; then
            echo "error: NEON enabled under x86_64 CodeQL configure" >&2
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: swift
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build macOS GUI (Swift)
        run: |
          set -euo pipefail
          # CodeQL Swift only indexes files compiled under the tracer. Build
          # every Swift-bearing target so puttygen/pterm/smokes/tests are not
          # reported as "excluded from scanning". PuttyMacUI is pulled in via
          # PuTTY/pterm; tracer overhead still dominates wall time.
          targets=(
            PuTTY
            pterm
            puttygen-app
            PuttyBridgeSwiftSmoke
            PuttyBridgeTermPerfTest
          )
          # PuttyMacUITests is optional (needs XCTest + SDK at configure time).
          if ninja -C build-codeql -t targets all 2>/dev/null \
               | grep -E '^PuttyMacUITests:' >/dev/null; then
            targets+=(PuttyMacUITests)
          else
            echo "note: PuttyMacUITests target absent; XCTest suite not traced"
          fi
          cmake --build build-codeql --parallel --target "${targets[@]}"
          ccache -s

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.3
        with:
          category: "/language:swift"
